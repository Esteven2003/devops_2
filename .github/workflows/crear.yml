name: CI de Python y Docker

on:
  push:
    branches: [ "main" ] # Se ejecuta cuando subes cambios a la rama main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No hay requirements.txt"

    - name: Test with pytest
      run: |
        pip install pytest
        pytest || echo "No se encontraron tests, saltando..."

    - name: Ejecutar la app
      run: python app.py

    - name: Simular el deploy
      run: echo "Simular que se esta desplegando"

    - name: Construir la imagen de docker
      run: docker build -t ghcr.io/Esteven2003/hola-mundo-python:1.0.0 .

    - name: Login en Github container registry
      run: echo "${{ secrets.GHCR_TOKEN}}" | docker login